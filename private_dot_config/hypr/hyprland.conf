source = ~/.config/hypr/hyprland-device.conf

general {
    gaps_in = 3
    gaps_out = 6

    layout = master
}

decoration {
    blur {
        enabled = false
        size = 4
        popups = true
        passes = 2
        new_optimizations = true
        vibrancy = 0.3
        ignore_opacity = true
        special = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = sideDown, 0.3, 1, 0.7, 1
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    # General window animations
    animation = windowsIn, 1, 2.5, easeOutQuint, slide
    animation = windowsOut, 1, 2.5,sideDown, slide
    animation = windows, 1, 5.0, easeOutQuint

    # Fade animations
    animation = fadeIn, 1, 2.0, almostLinear
    animation = fadeOut, 1, 1.8, almostLinear
    animation = fade, 1, 2.8, quick

    # Layer animations like dunst, rofi and hyprpaper
    animation = layers, 0, 4, ease, slidefade
    animation = layersOut, 0, 4, ease, slidefade

    # Workspace animations
    animation = workspaces, 0, 2.0, easeInOutCubic, slide
    animation = workspacesIn, 0, 3.0, easeInOutCubic, slide
    animation = workspacesOut, 0, 3.0, easeInOutCubic, slide
}

input {
    kb_model = pc104
    kb_layout = us,ir,us
    kb_variant = colemak,,
    kb_options = caps:backspace,grp:alt_shift_toggle

    repeat_rate = 25
    repeat_delay = 300

    scroll_method = 2fg

    touchpad {
        disable_while_typing = true
        natural_scroll = false
    }
}

xwayland {
    force_zero_scaling = true
}

group {
    groupbar {
        font_size = 12
        render_titles = false
    }
}

misc {
    force_default_wallpaper = -1
    on_focus_under_fullscreen = 1
    exit_window_retains_fullscreen = 0
    disable_hyprland_logo = true
    disable_splash_rendering = false
}

ecosystem {
    no_donation_nag = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    # smart_resizing = false
}

scrolling {
    fullscreen_on_one_column = true
    # wrap_focus = false
    # wrap_swapcol = false
}

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

exec-once = mpd
exec-once = hyprland-per-window-layout
exec-once = ianny
exec-once = systemctl —user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal -r
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst ~/.config/dunst/dunstrc
exec-once = udiskie
exec-once = foot --server
# exec-once = wl-paste -t text -w xclip -selection clipboard
exec-once = wl-paste --watch clipvault store
exec-once = hyprsunset
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = easyeffects --gapplication-service
exec-once = nm-applet
# exec-once = systemctl --user start ssh-agent

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

monitorv2 {
  output = DP-1
  mode = preferred
  position = 0x0
  scale = 1
}

monitorv2 {
  output = HDMI-A-1
  mode = preferred
  position = 1920x0
  scale = 1
}

monitorv2 {
  output =
  mode = preferred
  position = auto-right
  scale = 1
}

# rules

# workspaces
# workspacerule = 4, 

# windows
windowrule = match:class Myazi, workspace 3
windowrule = match:class Mnvim, workspace 4
windowrule = match:class com.github.iwalton3.jellyfin-media-player, workspace 6, idle_inhibit fullscreen
windowrule = match:class info.mumble.Mumble, $mblWs
windowrule = match:class virt-manager, $vmWs
windowrule = match:class zen, $zenWs
windowrule = match:class ^(org.telegram.desktop|telegramdesktop)$, $telWs
windowrule = match:class com.obsproject.Studio, $obsWs
windowrule = match:class org.qbittorrent.qBittorrent, $qbtWs

# scratchpads
workspace = special:btop, on-created-empty:footclient -a Mbtop -T btop -L btop -p 0
windowrule = match:class Mbtop, float on, size monitor_w*0.95 monitor_h*0.90, center on

workspace = special:ncmpcpp, on-created-empty:footclient -a Mncmpcpp -T ncmpcpp -L ncmpcpp
windowrule = match:class Mncmpcpp, float on, size monitor_w*0.95 monitor_h*0.90, center on

workspace = special:pavucontrol, on-created-empty:pavucontrol -t 4
windowrule = match:class org.pulseaudio.pavucontrol, float on, size 500 600, move monitor_w-window_w-20 monitor_h-window_h-20

workspace = special:easyeffects, on-created-empty:easyeffects
windowrule = match:class com.github.wwmm.easyeffects, float on, size monitor_w*0.95 monitor_h*0.90, center on

workspace = special:minimize,

# smart borders
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule = match:float 0, match:workspace w[tv1]s[false], border_size 0
windowrule = match:float 0, match:workspace w[tv1]s[false], rounding 0
windowrule = match:float 0, match:workspace f[1]s[false], border_size 0
windowrule = match:float 0, match:workspace f[1]s[false], rounding 0

# fix telegram Media viewer
windowrule = match:class ^(org.telegram.desktop|telegramdesktop)$, match:title ^(Media viewer)$, float on
windowrule = match:class ^(org.telegram.desktop|telegramdesktop)$, match:title ^(Media viewer)$, suppress_event fullscreen

layerrule = match:namespace notifications, no_screen_share on

$mainMod = SUPER

bind = $mainMod, 1, exec, hypr-workspace-helper focus 1
bind = $mainMod, 2, exec, hypr-workspace-helper focus 2
bind = $mainMod, 3, exec, hypr-workspace-helper focus 3
bind = $mainMod, 4, exec, hypr-workspace-helper focus 4
bind = $mainMod, 5, exec, hypr-workspace-helper focus 5
bind = $mainMod, 6, exec, hypr-workspace-helper focus 6
bind = $mainMod, 7, exec, hypr-workspace-helper focus 7
bind = $mainMod, 8, exec, hypr-workspace-helper focus 8
bind = $mainMod, 9, exec, hypr-workspace-helper focus 9
bind = $mainMod, 0, exec, hypr-workspace-helper focus 10

bind = $mainMod SHIFT, 1, exec, hypr-workspace-helper move 1
bind = $mainMod SHIFT, 2, exec, hypr-workspace-helper move 2
bind = $mainMod SHIFT, 3, exec, hypr-workspace-helper move 3
bind = $mainMod SHIFT, 4, exec, hypr-workspace-helper move 4
bind = $mainMod SHIFT, 5, exec, hypr-workspace-helper move 5
bind = $mainMod SHIFT, 6, exec, hypr-workspace-helper move 6
bind = $mainMod SHIFT, 7, exec, hypr-workspace-helper move 7
bind = $mainMod SHIFT, 8, exec, hypr-workspace-helper move 8
bind = $mainMod SHIFT, 9, exec, hypr-workspace-helper move 9
bind = $mainMod SHIFT, 0, exec, hypr-workspace-helper move 10

bind = $mainMod, W, focusmonitor, +1

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# layoutmsg master
bind = $mainMod, H, layoutmsg, focusmaster master
bind = $mainMod, N, layoutmsg, cyclenext
bind = $mainMod, E, layoutmsg, cycleprev
bind = $mainMod, I, layoutmsg, focusmaster auto
bind = $mainMod SHIFT, H, layoutmsg, swapwithmaster master ignoremaster
bind = $mainMod SHIFT, N, layoutmsg, swapnext
bind = $mainMod SHIFT, E, layoutmsg, swapprev
bind = $mainMod SHIFT, I, layoutmsg, swapwithmaster child
bind = $mainMod, MINUS, layoutmsg, mfact -0.05
bind = $mainMod, EQUAL, layoutmsg, mfact +0.05
bind = $mainMod, S, layoutmsg, cycleprev
bind = $mainMod, T, layoutmsg, cyclenext
bind = $mainMod, COMMA, layoutmsg, addmaster
bind = $mainMod, PERIOD, layoutmsg, removemaster
bind = $mainMod SHIFT, COMMA, layoutmsg, orientationprev
bind = $mainMod SHIFT, PERIOD, layoutmsg, orientationnext

# layoutmsg scrolling
bind = $mainMod, H, layoutmsg, focus l
bind = $mainMod, N, layoutmsg, focus d
bind = $mainMod, E, layoutmsg, focus u
bind = $mainMod, I, layoutmsg, focus r
bind = $mainMod SHIFT, H, layoutmsg, swapcol l
# bind = $mainMod SHIFT, N, layoutmsg, swapnext
# bind = $mainMod SHIFT, E, layoutmsg, swapprev
bind = $mainMod SHIFT, I, layoutmsg, swapcol r
bind = $mainMod, MINUS, layoutmsg, colresize -0.05
bind = $mainMod, EQUAL, layoutmsg, colresize +0.05
bind = $mainMod, S, layoutmsg, focus l
bind = $mainMod, T, layoutmsg, focus r
bind = $mainMod, COMMA, layoutmsg, promote
bind = $mainMod, PERIOD, layoutmsg, togglefit
# bind = $mainMod SHIFT, COMMA, layoutmsg, orientationprev
# bind = $mainMod SHIFT, PERIOD, layoutmsg, orientationnext

bind = $mainMod, R, cyclenext, next
bind = $mainMod, A, cyclenext, prev

bind = $mainMod SHIFT CTRL, H, movewindoworgroup, l
bind = $mainMod SHIFT CTRL, N, movewindoworgroup, d
bind = $mainMod SHIFT CTRL, E, movewindoworgroup, u
bind = $mainMod SHIFT CTRL, I, movewindoworgroup, r

bind = $mainMod, L, workspace, -1
bind = $mainMod, U, workspace, +1

bind = ALT, SPACE, exec, tofi-drun --drun-launch true
bind = $mainMod SHIFT, C, killactive
bind = $mainMod SHIFT, Z, movetoworkspacesilent, special:minimize
bind = $mainMod, Q, exec, footclient
bind = $mainMod SHIFT, A, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod SHIFT, P, pin, active
bind = $mainMod SHIFT, D, togglegroup
bind = $mainMod, GRAVE, exec, killall -SIGUSR1 waybar
bind = $mainMod SHIFT, BACKSLASH, exec, hyprlock
bind = $mainMod SHIFT CTRL, BACKSLASH, exec, sleep 1 && hyprctl dispatch forceidle 3600
bind = $mainMod SHIFT, V, exec, clipvault list | tofi | clipvault get | wl-copy
bind = $mainMod SHIFT, J, exec, hyprpicker -a -l

bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod, D, submap, group

submap = group
bind = , 1, changegroupactive, 1
bind = , 2, changegroupactive, 2
bind = , 3, changegroupactive, 3
bind = , 4, changegroupactive, 4
bind = , 5, changegroupactive, 5
bind = , 6, changegroupactive, 6
bind = , 7, changegroupactive, 7
bind = , 8, changegroupactive, 8
bind = , 9, changegroupactive, 9
bind = , 0, changegroupactive, 10

bind = , H, changegroupactive, b
bind = , N, changegroupactive, b
bind = , E, changegroupactive, f
bind = , I, changegroupactive, f

bind = , L, lockactivegroup, toggle

bind = , ESCAPE, submap, reset
submap = reset

# shutdown menu
bind = $mainMod SHIFT, Q, exec, tofi-shutdown-menu

# specials
bind = $mainMod SHIFT, SEMICOLON, togglespecialworkspace, btop
bind = $mainMod SHIFT, BRACKETLEFT, togglespecialworkspace, ncmpcpp
bind = $mainMod SHIFT, Y, togglespecialworkspace, pavucontrol
bind = $mainMod SHIFT, BRACKETRIGHT, togglespecialworkspace, minimize

# exec or focus
bind = $mainMod, P, exec, hypr-exec-or-focus Myazi footclient -a Myazi -T yazi -L yazi
bind = $mainMod, C, exec, hypr-exec-or-focus Mnvim footclient -a Mnvim -T neovim -L zellij a -c dev
bind = $mainMod, V, exec, hypr-exec-or-focus org.telegram.desktop Telegram
bind = $mainMod, B, exec, hypr-exec-or-focus zen zen-browser

# screenshots
bind = $mainMod SHIFT, R, submap, screenshot
bind = , PRINT, submap, screenshot

submap = screenshot

bind = , 1, exec, hyprshot -m output --clipboard-only
bind = , 2, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = , 3, exec, hyprshot -m window --clipboard-only
bind = , 4, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = , 5, exec, hyprshot -m region --clipboard-only
bind = , 6, exec, hyprshot -m region -o ~/Pictures/Screenshots

bind = , 1, submap, reset
bind = , 2, submap, reset
bind = , 3, submap, reset
bind = , 4, submap, reset
bind = , 5, submap, reset
bind = , 6, submap, reset

bind = , f, submap, screenshotfreeze

bind = , catchall, submap, reset

submap = screenshotfreeze 

bind = , 1, exec, hyprshot -z -m output --clipboard-only
bind = , 2, exec, hyprshot -z -m output -o ~/Pictures/Screenshots
bind = , 3, exec, hyprshot -z -m window --clipboard-only
bind = , 4, exec, hyprshot -z -m window -o ~/Pictures/Screenshots
bind = , 5, exec, hyprshot -z -m region --clipboard-only
bind = , 6, exec, hyprshot -z -m region -o ~/Pictures/Screenshots

bind = , 1, submap, reset
bind = , 2, submap, reset
bind = , 3, submap, reset
bind = , 4, submap, reset
bind = , 5, submap, reset
bind = , 6, submap, reset

bind = , catchall, submap, reset

submap = screenshot
submap = reset

# sound and microphone
bindl = ALT, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = ALT, F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindle = ALT, F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = SUPER, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = SUPER, F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%-
bindle = SUPER, F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = SUPER, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = SUPER, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%-
bindle = SUPER, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+

# player
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next

# brightness
bindl = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 5%-

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
