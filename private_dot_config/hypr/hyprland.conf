source = ~/.config/hypr/hyprland-device.conf

general {
    gaps_in = 3
    gaps_out = 6

    layout = master
}

decoration {
    blur {
        enabled = false
        size = 4
        popups = true
        passes = 2
        new_optimizations = true
        vibrancy = 0.3
        ignore_opacity = true
        special = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false

    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = sideDown, 0.3, 1, 0.7, 1
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    # General window animations
    animation = windowsIn, 0, 2.5, easeOutQuint, slide
    animation = windowsOut, 0, 2.5,sideDown, slide
    animation = windows, 0, 5.0, easeOutQuint

    # Fade animations
    animation = fadeIn, 0, 2.0, almostLinear
    animation = fadeOut, 0, 1.8, almostLinear
    animation = fade, 0, 2.8, quick

    # Layer animations like dunst, rofi and hyprpaper
    animation = layers, 1, 4, ease, slidefade
    animation = layersOut, 1, 4, ease, slidefade

    # Workspace animations
    animation = workspaces, 0, 2.0, easeInOutCubic, slide
    animation = workspacesIn, 0, 3.0, easeInOutCubic, slide
    animation = workspacesOut, 0, 3.0, easeInOutCubic, slide
}

input {
    kb_model = pc104
    kb_layout = us,ir,us
    kb_layout = us,ir,us
    kb_variant = colemak,,
    kb_options = caps:backspace,grp:alt_shift_toggle

    repeat_rate = 25
    repeat_delay = 300

    scroll_method = 2fg

    touchpad {
        disable_while_typing = true
        natural_scroll = false
    }
}

xwayland {
    force_zero_scaling = true
}

group {
    groupbar {
        font_size = 12
        render_titles = false
    }
}

misc {
    force_default_wallpaper = -1
    new_window_takes_over_fullscreen = 2
    exit_window_retains_fullscreen = 0
    disable_hyprland_logo = true
    disable_splash_rendering = false
}

cursor {
    default_monitor = DP-1
}

ecosystem {
    no_donation_nag = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    # smart_resizing = false
}

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

exec-once = hyprpm reload -n
exec-once = mpd
exec-once = hyprland-per-window-layout
exec-once = ianny
exec-once = dbus-update-activation-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = /usr/lib/xdg-desktop-portal -r
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst ~/.config/dunst/dunstrc
exec-once = udiskie
exec-once = foot --server
exec-once = wl-paste -t text -w xclip -selection clipboard
exec-once = wl-paste --watch clipvault store
exec-once = hyprsunset
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = easyeffects --gapplication-service
exec-once = nm-applet

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

monitorv2 {
  output = DP-1
  mode = preferred
  position = 0x0
  scale = 1
}

monitorv2 {
  output = HDMI-A-1
  mode = preferred
  position = 1920x0
  scale = 1
}

monitorv2 {
  output =
  mode = preferred
  position = auto-right
  scale = 1
}

plugin {
    split-monitor-workspaces {
        count = 12
        keep_focused = true
    }
}

# rules

# workspaces
# workspacerule = 4, 

# windows
windowrule = workspace 3, class:Myazi
windowrule = workspace 4, class:Mnvim
windowrule = workspace 6, class:com.github.iwalton3.jellyfin-media-player
windowrule = idleinhibit fullscreen, class:com.github.iwalton3.jellyfin-media-player
windowrule = $mblWs, class:info.mumble.Mumble
windowrule = $vmWs, class:virt-manager
windowrule = $zenWs, class:zen
windowrule = $telWs, class:^(org.telegram.desktop|telegramdesktop)$
windowrule = $obsWs, class:com.obsproject.Studio
windowrule = $qbtWs, class:org.qbittorrent.qBittorrent

# scratchpads
workspace = special:btop, on-created-empty:footclient -a Mbtop -T btop -L btop -p 0
windowrule = float, class:Mbtop
windowrule = size 95% 90%, class:Mbtop
windowrule = center, class:Mbtop

workspace = special:ncmpcpp, on-created-empty:footclient -a Mncmpcpp -T ncmpcpp -L ncmpcpp
windowrule = float, class:Mncmpcpp
windowrule = size 95% 90%, class:Mncmpcpp
windowrule = center, class:Mncmpcpp

workspace = special:pavucontrol, on-created-empty:pavucontrol -t 4
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = size 500 600, class:org.pulseaudio.pavucontrol
windowrule = move 100%-w-20 100%-w-20, class:org.pulseaudio.pavucontrol

workspace = special:easyeffects, on-created-empty:easyeffects
windowrule = float, class:com.github.wwmm.easyeffects
windowrule = size 95% 90%, class:com.github.wwmm.easyeffects
windowrule = center, class:com.github.wwmm.easyeffects

workspace = special:minimize,

# smart borders
# workspace = w[tv1]s[false], gapsout:0, gapsin:0, border:false
# workspace = f[1]s[false], gapsout:0, gapsin:0, border:false
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
# windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]

# fix telegram Media viewer
windowrule = float, class:^(org.telegram.desktop|telegramdesktop)$,title:^(Media viewer)$
windowrule = suppressevent fullscreen, class:^(org.telegram.desktop|telegramdesktop)$,title:^(Media viewer)$

windowrule = maximize, workspace:4
windowrule = maximize, workspace:6
windowrule = maximize, workspace:18

$mainMod = SUPER

bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10
bind = $mainMod, MINUS, split-workspace, 11
bind = $mainMod, EQUAL, split-workspace, 12

bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10
bind = $mainMod SHIFT, MINUS, split-movetoworkspacesilent, 11
bind = $mainMod SHIFT, EQUAL, split-movetoworkspacesilent, 12

bind = $mainMod, W, focusmonitor, +1
bind = $mainMod SHIFT, W, split-changemonitor, +1

bind = $mainMod, H, movefocus, l
bind = $mainMod, N, movefocus, d
bind = $mainMod, E, movefocus, u
bind = $mainMod, I, movefocus, r

bind = $mainMod, A, cyclenext
bind = $mainMod, R, cyclenext

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, N, movewindow, d
bind = $mainMod SHIFT, E, movewindow, u
bind = $mainMod SHIFT, I, movewindow, r

bind = $mainMod SHIFT CTRL, H, movewindoworgroup, l
bind = $mainMod SHIFT CTRL, N, movewindoworgroup, d
bind = $mainMod SHIFT CTRL, E, movewindoworgroup, u
bind = $mainMod SHIFT CTRL, I, movewindoworgroup, r

bind = $mainMod SHIFT, L, splitratio, -0.05
bind = $mainMod SHIFT, U, splitratio, +0.05

bind = $mainMod, S, layoutmsg, addmaster
bind = $mainMod, T, layoutmsg, removemaster

bind = ALT, SPACE, exec, tofi-drun --drun-launch true
bind = $mainMod SHIFT, C, killactive
bind = $mainMod SHIFT, Z, movetoworkspacesilent, special:minimize
bind = $mainMod, Q, exec, footclient
bind = $mainMod SHIFT, A, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod SHIFT, P, pin, active
bind = $mainMod SHIFT, D, togglegroup
bind = $mainMod, GRAVE, exec, killall -SIGUSR1 waybar
bind = $mainMod SHIFT, BACKSLASH, exec, hyprlock
bind = $mainMod SHIFT CTRL, BACKSLASH, exec, sleep 1 && killall -SIGUSR1 hypridle
bind = $mainMod SHIFT, V, exec, clipvault list | tofi | clipvault get | wl-copy
bind = $mainMod SHIFT, J, exec, hyprpicker -a -l

bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod, D, submap, group

submap = group
bind = , 1, changegroupactive, 1
bind = , 2, changegroupactive, 2
bind = , 3, changegroupactive, 3
bind = , 4, changegroupactive, 4
bind = , 5, changegroupactive, 5
bind = , 6, changegroupactive, 6
bind = , 7, changegroupactive, 7
bind = , 8, changegroupactive, 8
bind = , 9, changegroupactive, 9
bind = , 0, changegroupactive, 10

bind = , H, changegroupactive, b
bind = , N, changegroupactive, b
bind = , E, changegroupactive, f
bind = , I, changegroupactive, f

bind = , L, lockactivegroup, toggle

bind = , ESCAPE, submap, reset
submap = reset

# specials
bind = $mainMod SHIFT, SEMICOLON, togglespecialworkspace, btop
bind = $mainMod SHIFT, BRACKETLEFT, togglespecialworkspace, ncmpcpp
bind = $mainMod SHIFT, Y, togglespecialworkspace, pavucontrol
bind = $mainMod SHIFT, BRACKETRIGHT, togglespecialworkspace, minimize
bind = $mainMod SHIFT CTRL, Y, togglespecialworkspace, easyeffects

# exec or focus
bind = $mainMod, P, exec, hypr-exec-or-focus Myazi footclient -a Myazi -T yazi -L yazi
bind = $mainMod, C, exec, hypr-exec-or-focus Mnvim footclient -a Mnvim -T neovim -L zellij a -c dev
bind = $mainMod, V, exec, hypr-exec-or-focus org.telegram.desktop Telegram
bind = $mainMod, B, exec, hypr-exec-or-focus zen zen-browser

# screenshots
bind = $mainMod SHIFT, R, submap, screenshot
bind = , PRINT, submap, screenshot

submap = screenshot

bind = , 1, exec, hyprshot -m output --clipboard-only
bind = , 2, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = , 3, exec, hyprshot -m window --clipboard-only
bind = , 4, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = , 5, exec, hyprshot -m region --clipboard-only
bind = , 6, exec, hyprshot -m region -o ~/Pictures/Screenshots

bind = , 1, submap, reset
bind = , 2, submap, reset
bind = , 3, submap, reset
bind = , 4, submap, reset
bind = , 5, submap, reset
bind = , 6, submap, reset

bind = , f, submap, screenshotfreeze

bind = , catchall, submap, reset

submap = screenshotfreeze 

bind = , 1, exec, hyprshot -z -m output --clipboard-only
bind = , 2, exec, hyprshot -z -m output -o ~/Pictures/Screenshots
bind = , 3, exec, hyprshot -z -m window --clipboard-only
bind = , 4, exec, hyprshot -z -m window -o ~/Pictures/Screenshots
bind = , 5, exec, hyprshot -z -m region --clipboard-only
bind = , 6, exec, hyprshot -z -m region -o ~/Pictures/Screenshots

bind = , 1, submap, reset
bind = , 2, submap, reset
bind = , 3, submap, reset
bind = , 4, submap, reset
bind = , 5, submap, reset
bind = , 6, submap, reset

bind = , catchall, submap, reset

submap = screenshot
submap = reset

# sound and microphone
bindl = ALT, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = ALT, F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindle = ALT, F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = SUPER, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = SUPER, F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%-
bindle = SUPER, F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = SUPER, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = SUPER, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%-
bindle = SUPER, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+

# player
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next

# brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
