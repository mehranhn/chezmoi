[manager]
prepend_keymap = [
    # Hopping
    { on = "e", run = "arrow -1", desc = "Move cursor up" },
    { on = "n", run = "arrow 1",  desc = "Move cursor down" },
    { on = "E", run = "arrow -5", desc = "Move cursor up" },
    { on = "N", run = "arrow 5",  desc = "Move cursor down" },

	{ on = "E", run = "seek -5",  desc = "Seek up 5 units in the preview" },
	{ on = "N", run = "seek 5",   desc = "Seek down 5 units in the preview" },

    # Navigation
    { on = "i", run = "plugin smart-enter", desc = "Enter the child directory or open the file" },
    { on = "I", run = "forward",                   desc = "Go forward to the next directory" },

    # Seeking
    { on = "<A-e>", run = "seek -5", desc = "Seek up 5 units in the preview" },
	{ on = "<A-n>", run = "seek 5",  desc = "Seek down 5 units in the preview" },

    # Selection
	{ on = "u", run = "select_all --state=false", desc = "Inverse selection of all files" },

    # find
    { on = ",", run = "find_arrow",               desc = "Go to the next found" },
	{ on = ".", run = "find_arrow --previous",    desc = "Go to the previous found" },

	# # Operation
	# { on = "C",         run = "unyank",                      desc = "Cancel the yank status" },
	{ on = "K",     run = "hidden toggle", desc = "Toggle the visibility of hidden files" },
	{ on = "<C-o>", run = '''shell 'dragon-drop -x -A -T "$@"' --confirm''', desc = "Dragon Drop" },
	{ on = "V",     run = '''shell 'if [ -z "$@" ]; then vidir; else printf "%s\n" "$@" | vidir -; fi' --block --confirm''', desc = "Dragon Drop" },

    # Comepression
    { on = ["C", "z"], run = "plugin ouch --args=zip",    desc = "Compress zip" },
    { on = ["C", "Z"], run = "plugin ouch --args=7z",     desc = "Compress 7z" },
    { on = ["C", "t"], run = "plugin ouch --args=tar.gz", desc = "Compress tar.gz" },
    { on = ["C", "T"], run = "plugin ouch --args=tar.xz", desc = "Compress tar.xz" },

	# Sorting
	{ on = [ "k", "m" ], run = [ "sort modified --reverse=no", "linemode mtime" ], desc = "Sort by modified time" },
	{ on = [ "k", "M" ], run = [ "sort modified --reverse", "linemode mtime" ],    desc = "Sort by modified time (reverse)" },
	{ on = [ "k", "c" ], run = [ "sort created --reverse=no", "linemode ctime" ],  desc = "Sort by created time" },
	{ on = [ "k", "C" ], run = [ "sort created --reverse", "linemode ctime" ],     desc = "Sort by created time (reverse)" },
	{ on = [ "k", "e" ], run = "sort extension --reverse=no",                      desc = "Sort by extension" },
	{ on = [ "k", "E" ], run = "sort extension --reverse",                         desc = "Sort by extension (reverse)" },
	{ on = [ "k", "a" ], run = "sort alphabetical --reverse=no",                   desc = "Sort alphabetically" },
	{ on = [ "k", "A" ], run = "sort alphabetical --reverse",                      desc = "Sort alphabetically (reverse)" },
	{ on = [ "k", "n" ], run = "sort natural --reverse=no",                        desc = "Sort naturally" },
	{ on = [ "k", "N" ], run = "sort natural --reverse",                           desc = "Sort naturally (reverse)" },
	{ on = [ "k", "s" ], run = [ "sort size --reverse=no", "linemode size" ],      desc = "Sort by size" },
	{ on = [ "k", "S" ], run = [ "sort size --reverse", "linemode size" ],         desc = "Sort by size (reverse)" },
	{ on = [ "k", "r" ], run = "sort random --reverse=no",                         desc = "Sort randomly" },

	# Goto
	{ on = [ "g", "d" ],                 run = "cd ~/Downloads",                  desc = "Go to the downloads directory" },
	{ on = [ "g", "s", "s" ],            run = "cd ~/Videos/Shows/shared",        desc = "Go to the show shared directory" },
	{ on = [ "g", "s", "r" ],            run = "cd ~/Videos/Shows/private",       desc = "Go to the show private directory" },
	{ on = [ "g", "a", "s" ],            run = "cd ~/Videos/Anime/shared",        desc = "Go to the anime shared directory" },
	{ on = [ "g", "a", "r" ],            run = "cd ~/Videos/Anime/private",       desc = "Go to the anime private directory" },
	{ on = [ "g", "m", "s" ],            run = "cd ~/Videos/Movies/shared",       desc = "Go to the movies shared directory" },
	{ on = [ "g", "m", "r" ],            run = "cd ~/Videos/Movies/private",      desc = "Go to the movies private directory" },
	{ on = [ "g", "z", "s", "s" ],       run = "cd ~/Videos/z1/Shows/shared",     desc = "Go to the z1 show shared directory" },
	{ on = [ "g", "z", "s", "r" ],       run = "cd ~/Videos/z1/Shows/private",    desc = "Go to the z1 show private directory" },
	{ on = [ "g", "z", "a", "s" ],       run = "cd ~/Videos/z1/Anime/shared",     desc = "Go to the z1 anime shared directory" },
	{ on = [ "g", "z", "a", "r" ],       run = "cd ~/Videos/z1/Anime/private",    desc = "Go to the z1 anime private directory" },
	{ on = [ "g", "z", "m", "s" ],       run = "cd ~/Videos/z1/Movies/shared",    desc = "Go to the z1 movies shared directory" },
	{ on = [ "g", "z", "m", "r" ],       run = "cd ~/Videos/z1/Movies/private",   desc = "Go to the z1 movies private directory" },
]

[tasks]
prepend_keymap = [
	{ on = "q", run = "close", desc = "Close task manager" },

	{ on = "e", run = "arrow -1", desc = "Move cursor up" },
	{ on = "n", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "i", run = "inspect",  desc = "Inspect the task" },
	{ on = "o", run = "inspect",  desc = "Inspect the task" },
	{ on = "d", run = "cancel",   desc = "Cancel the task" },
]

[select]
prepend_keymap = [
	{ on = "h", run = "close",          desc = "Submit the selection" },
	{ on = "o", run = "close --submit", desc = "Submit the selection" },
	{ on = "i", run = "close --submit", desc = "Submit the selection" },

	{ on = "e", run = "arrow -1",       desc = "Move cursor up" },
	{ on = "n", run = "arrow 1",        desc = "Move cursor down" },
]

[input]
prepend_keymap = [
	# Mode
	{ on = "k",     run = "insert",                  desc = "Enter insert mode" },
	{ on = "K",     run = [ "move -999", "insert" ], desc = "Move to the BOL, and enter insert mode" },

	# Character-wise movement
	{ on = "i",     run = "move 1",                  desc = "Move forward a character" },

	# Word-wise movement
	{ on = "j",     run = "forward --end-of-word",   desc = "Move forward to the end of the current or next word" },

	# Line-wise movement
	{ on = "H",     run = "move -999",               desc = "Move to the BOL" },
	{ on = "I",     run = "move 999",                desc = "Move to the EOL" },

	# Delete
	{ on = "<C-h>", run = "backspace",               desc = "Delete the character before the cursor" },
	{ on = "<C-i>", run = "backspace --under",       desc = "Delete the character under the cursor" },

	# Kill
	{ on = "<C-e>", run = "kill eol",                desc = "Kill forwards to the EOL" },
]

[completion]
prepend_keymap = [
	{ on = "<Tab>",   run = "close --submit",                             desc = "Submit the completion" },
	{ on = "<Enter>", run = [ "close --submit", "close_input --submit" ], desc = "Submit the completion and input" },

	{ on = "<C-e>", run = "arrow -1",  desc = "Move cursor up" },
	{ on = "<C-n>", run = "arrow 1",   desc = "Move cursor down" },

	{ on = "<A-e>", run = "arrow -1",  desc = "Move cursor up" },
	{ on = "<A-n>", run = "arrow 1",   desc = "Move cursor down" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<C-.>", run = "arrow -1",  desc = "Move cursor up" },
	{ on = "<C-,>", run = "arrow 1",   desc = "Move cursor down" },

	# Help
	{ on = "~",    run = "help",       desc = "Open help" },
	{ on = "<F1>", run = "help",       desc = "Open help" },
]

[help]
prepend_keymap = [
	# Navigation
	{ on = "e", run = "arrow -1", desc = "Move cursor up" },
	{ on = "n", run = "arrow 1",  desc = "Move cursor down" },
]
